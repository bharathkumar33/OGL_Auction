<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGL 2026 Auction App</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin:0; padding:0;
  background: url('background.png') no-repeat center center fixed;
  background-size: cover;
}
nav {
  display:flex;
  background:#e63946;
}
nav button {
  flex:1;
  padding:12px;
  border:none;
  background:none;
  color:white;
  font-size:16px;
  cursor:pointer;
}
nav button.active { background:#c62828; }
.screen { display:none; padding:15px; }
.screen.active {
  display:block;
  background:rgba(255,255,255,0.9);
  margin:15px;
  border-radius:10px;
}
table { width:100%; border-collapse:collapse; }
th,td { border:1px solid #ccc; padding:8px; text-align:center; }
th { background:#e63946; color:white; }
.player-photo { width:50px; height:50px; border-radius:50%; }
.team-card {
  background:white;
  border-radius:10px;
  padding:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
  margin:10px 0;
}
.bid-btn {
  background:#2a9d8f;
  color:white;
  border:none;
  padding:6px 10px;
  margin:3px;
  border-radius:6px;
  cursor:pointer;
}
.player-card {
  position:relative;
  background:white;
  border-radius:10px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}
.reset-btn {
  background:#f4a261;
  color:white;
  padding:6px 12px;
  border:none;
  border-radius:6px;
}
.log {
  max-height:200px;
  overflow-y:auto;
  background:#f1f1f1;
  padding:10px;
  border-radius:6px;
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<nav>
  <button onclick="showScreen('players',this)">Registered Players</button>
  <button class="active" onclick="showScreen('auction',this)">Auction</button>
  <button onclick="showScreen('auctioned',this)">Auctioned Teams</button>
</nav>
<div id="players" class="screen">
  <h2>Registered Players</h2>
  <input type="file" id="csvFile" accept=".csv">
  <button onclick="uploadCSV()">Upload CSV</button>
  <button class="reset-btn" onclick="resetCSV()">Reset CSV</button>
  <table>
    <thead>
      <tr><th>Photo</th><th>Name</th><th>Base Price</th></tr>
    </thead>
    <tbody id="playersTable"></tbody>
  </table>
</div>
<div id="auction" class="screen active">
  <h2>Auction</h2>
  <h3>Team Wallets</h3>
  <div id="teamWallets"></div>
  <h3>Available Players</h3>
  <div id="availablePlayers"></div>
  <h3>Bid History</h3>
  <div id="bidLog" class="log"></div>
  <button class="reset-btn" onclick="resetAuction()">Reset Auction</button>
</div>
<div id="auctioned" class="screen">
  <h2>Auctioned Teams</h2>
  <div id="auctionedList"></div>
</div>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBy0sIQw74accRCg_YSzQ-j-4JrcDllSko",
  authDomain:"ogl-auction.firebaseapp.com",
  databaseURL:"https://ogl-auction-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ogl-auction"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let teams = [
  { name:"Charging Bulls", wallet:14000, squad:[], logo:"ChargingBulls.png" },
  { name:"Mighty Tuskers", wallet:14000, squad:[], logo:"MightyTuskers.png" },
  { name:"Royal Tigers", wallet:14000, squad:[], logo:"RoyalTigers.png" },
  { name:"Blazing Phoenix", wallet:14000, squad:[], logo:"BlazingPhoenix.png" },
  { name:"Golden Eagle", wallet:14000, squad:[], logo:"GoldenEagle.png" },
  { name:"Power Panthers", wallet:14000, squad:[], logo:"PowerPanthers.png" }
];

let availablePlayers = [];
let bidLog = [];

function showScreen(id,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function uploadCSV(){
  const file=document.getElementById('csvFile').files[0];
  if(!file) return alert("Select CSV");
  Papa.parse(file,{
    header:true,
    skipEmptyLines:true,
    complete:function(res){
      availablePlayers=res.data.map(function(p){
        return {
          name: p.FirstName + ' ' + p.LastName,
          basePrice: parseInt(p.BasePrice) || 1000,
          photo: p.Photo || "default.png"
        };
      });
      db.ref('registeredPlayers').set(availablePlayers);
      saveAuction();
      renderAll();
    }
  });
}

function resetCSV(){
  if(confirm("Clear players?")){
    availablePlayers=[];
    db.ref('registeredPlayers').remove();
    saveAuction();
    renderAll();
  }
}

function placeBid(ti,pi){
  ti = parseInt(ti);
  pi = parseInt(pi);
  
  const team=teams[ti];
  const player=availablePlayers[pi];
  
  if(!team) {
    alert('Error: Team not found');
    return;
  }
  
  if(!player) {
    alert('Error: Player not found');
    return;
  }
  
  if(!team.squad) team.squad = [];
  
  if(team.squad.length>=14) {
    alert("Squad full");
    return;
  }

  const amt=prompt('Enter bid amount for ' + player.name + '\nBase Price: ₹' + player.basePrice + '\nTeam: ' + team.name + '\nWallet: ₹' + team.wallet, player.basePrice);
  
  if(amt === null) return;
  if(!amt || isNaN(amt) || parseInt(amt) <= 0) {
    alert("Invalid bid amount");
    return;
  }
  if(parseInt(amt) > team.wallet) {
    alert("Insufficient wallet balance");
    return;
  }
  if(parseInt(amt) < player.basePrice) {
    alert('Bid must be at least ₹' + player.basePrice);
    return;
  }

  if(!confirm('Confirm bid:\n' + team.name + ' bids ₹' + amt + ' for ' + player.name + '?')) return;

  team.wallet -= parseInt(amt);
  team.squad.push({name:player.name, amount:parseInt(amt), photo:player.photo});
  bidLog.push({team:team.name,player:player.name,amount:parseInt(amt),timestamp:new Date().toLocaleTimeString()});
  availablePlayers.splice(pi,1);

  saveAuction();
  renderAll();
}

function resetAuction(){
  if(confirm("Reset auction?")){
    teams.forEach(function(t){t.wallet=14000;t.squad=[];});
    bidLog=[];
    saveAuction();
    renderAll();
  }
}

function saveAuction(){
  db.ref('auctionState').set({teams:teams,availablePlayers:availablePlayers,bidLog:bidLog});
}

function renderAll(){
  document.getElementById('playersTable').innerHTML = availablePlayers.map(function(p){
    return '<tr><td><img class="player-photo" src="' + p.photo + '"></td><td>' + p.name + '</td><td>₹' + p.basePrice + '</td></tr>';
  }).join('');

  document.getElementById('teamWallets').innerHTML = teams.map(function(t){
    return '<div class="team-card"><b>' + t.name + '</b><br>Wallet: ₹' + t.wallet + '</div>';
  }).join('');

  document.getElementById('availablePlayers').innerHTML = availablePlayers.map(function(p,i){
    return '<div class="player-card">' +
      '<img class="player-photo" src="' + p.photo + '" style="float:left;margin-right:10px;">' +
      '<b>' + p.name + '</b><br>' +
      'Base Price: ₹' + p.basePrice + '<br><br>' +
      '<div>' +
        teams.map(function(t,j){
          return '<button class="bid-btn" onclick="placeBid(' + j + ',' + i + ')">' + t.name + '</button>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('bidLog').innerHTML = bidLog.map(function(b){
    return '<div style="margin:5px 0;padding:5px;background:white;border-radius:5px;">' +
      '<strong>' + b.team + '</strong> bought <strong>' + b.player + '</strong> for <strong>₹' + b.amount + '</strong>' +
      (b.timestamp ? '<span style="float:right;color:#666;font-size:12px;">' + b.timestamp + '</span>' : '') +
    '</div>';
  }).join('');

  document.getElementById('auctionedList').innerHTML = teams.map(function(t){
    if(!t.squad) t.squad = [];
    return '<div class="team-card">' +
      '<h3>' + t.name + '</h3>' +
      '<p>Wallet: ₹' + t.wallet + ' | Squad: ' + t.squad.length + '/14</p>' +
      '<ul>' + t.squad.map(function(p){ return '<li>' + p.name + ' - ₹' + p.amount + '</li>'; }).join('') + '</ul>' +
    '</div>';
  }).join('');
}

db.ref('registeredPlayers').once('value').then(function(s){
  if(s.exists()) availablePlayers=s.val();
  renderAll();
});

db.ref('auctionState').on('value',function(s){
  if(!s.exists()) return;
  var d=s.val();
  teams=d.teams||teams;
  availablePlayers=d.availablePlayers||availablePlayers;
  bidLog=d.bidLog||[];
  renderAll();
});
</script>
</body>
</html>
