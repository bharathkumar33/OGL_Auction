<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGL 2026 Auction App</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin:0; padding:0;
  background: url('background.png') no-repeat center center fixed;
  background-size: cover;
}
nav {
  display:flex;
  background:#e63946;
}
nav button {
  flex:1;
  padding:12px;
  border:none;
  background:none;
  color:white;
  font-size:16px;
  cursor:pointer;
}
nav button.active { background:#c62828; }
.screen { display:none; padding:15px; }
.screen.active {
  display:block;
  background:rgba(255,255,255,0.9);
  margin:15px;
  border-radius:10px;
}
table { width:100%; border-collapse:collapse; }
th,td { border:1px solid #ccc; padding:8px; text-align:center; position:relative; }
th { background:#e63946; color:white; }
.player-photo { width:50px; height:50px; border-radius:50%; }
.team-card {
  background:white;
  border-radius:10px;
  padding:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
  margin:10px 0;
}
.bid-btn {
  background:#2a9d8f;
  color:white;
  border:none;
  padding:6px 10px;
  margin:3px;
  border-radius:6px;
  cursor:pointer;
}
.bid-btn:disabled {
  background:#ccc;
  cursor:not-allowed;
}
.complete-team {
  background:#28a745;
  color:white;
  text-align:center;
  padding:20px;
  border-radius:10px;
  margin:10px 0;
}
.trophy {
  font-size:30px;
  margin:10px;
}
.player-card {
  position:relative;
  background:white;
  border-radius:10px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}
.reset-btn {
  background:#f4a261;
  color:white;
  padding:6px 12px;
  border:none;
  border-radius:6px;
}
.log {
  max-height:200px;
  overflow-y:auto;
  background:#f1f1f1;
  padding:10px;
  border-radius:6px;
}
.rank-badge {
  display:inline-block;
  padding:2px 8px;
  border-radius:12px;
  font-size:12px;
  font-weight:bold;
  margin-left:10px;
}
.rank-1 { background:#ffd700; color:#000; }
.rank-2 { background:#c0c0c0; color:#000; }
.rank-3 { background:#cd7f32; color:#fff; }
.icon-badge { background:#e74c3c; color:#fff; }
.owner-badge { background:#17a2b8; color:#fff; }
.team-owner-badge { background:#6f42c1; color:#fff; }
#teamWallets {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
#teamWallets .team-card {
  margin:0;
}
.rank-counter {
  background:white;
  border-radius:10px;
  padding:15px;
  margin:10px 0;
  display:flex;
  justify-content:space-around;
  text-align:center;
}
#auctionedList {
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}
.auction-team-card {
  background:white;
  border-radius:10px;
  padding:10px;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
  position:relative;
  overflow:hidden;
  min-height:400px;
}
.team-logo-watermark {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  opacity:0.1;
  object-fit:contain;
  z-index:1;
}
.team-content {
  position:relative;
  z-index:2;
}
.team-name-highlight {
  background:#e63946;
  color:white;
  padding:8px;
  border-radius:8px;
  font-weight:bold;
  text-align:center;
  margin-bottom:10px;
}
.sold-player {
  background:rgba(220,53,69,0.1);
  padding:3px 5px;
  border-radius:5px;
  margin:2px 0;
  border-left:3px solid #dc3545;
}
.wallet-highlight {
  background:linear-gradient(45deg, #dc3545, #ffed4e);
  padding:15px;
  border-radius:10px;
  margin:10px 0;
  box-shadow:0 4px 8px rgba(255,215,0,0.3);
  border:2px solid #dc3545;
}
.wallet-title {
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#b8860b;
  margin-bottom:15px;
  text-shadow:1px 1px 2px rgba(0,0,0,0.1);
}
.sold-stamp {
  position:absolute;
  top:5px;
  right:5px;
  background:#dc3545;
  color:white;
  padding:3px 6px;
  border-radius:10px;
  font-weight:bold;
  font-size:10px;
  transform:rotate(15deg);
  z-index:10;
}
.unsold-stamp {
  position:absolute;
  top:5px;
  right:5px;
  background:#6c757d;
  color:white;
  padding:3px 6px;
  border-radius:10px;
  font-weight:bold;
  font-size:10px;
  transform:rotate(15deg);
  z-index:10;
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<nav>
  <button onclick="showScreen('players',this)">Registered Players</button>
  <button class="active" onclick="showScreen('auction',this)">Auction</button>
  <button onclick="showScreen('auctioned',this)">Auctioned Teams</button>
</nav>
<div id="players" class="screen">
  <h2>Registered Players</h2>
  <input type="file" id="csvFile" accept=".csv">
  <button onclick="uploadCSV()">Upload CSV</button>
  <button class="reset-btn" onclick="resetCSV()">Reset CSV</button>
  <table>
    <thead>
      <tr><th>Photo</th><th>Name & Rank</th><th>Base Price</th></tr>
    </thead>
    <tbody id="playersTable"></tbody>
  </table>
</div>
<div id="auction" class="screen active">
  <div class="wallet-highlight">
    <div class="wallet-title">TEAM OWNER / WALLET</div>
    <div id="teamWallets"></div>
  </div>
  <div id="rankCounter" class="rank-counter"></div>
  <h3>Available Players</h3>
  <div id="availablePlayers"></div>
  <h3>Bid History</h3>
  <div id="bidLog" class="log"></div>
  <button class="reset-btn" onclick="resetAuction()">Reset Auction</button>
</div>
<div id="auctioned" class="screen">
  <h2>Auctioned Teams</h2>
  <div id="auctionedList"></div>
</div>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBy0sIQw74accRCg_YSzQ-j-4JrcDllSko",
  authDomain:"ogl-auction.firebaseapp.com",
  databaseURL:"https://ogl-auction-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"ogl-auction"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let teams = [
  { name:"Charging Bulls", wallet:14000, squad:[], logo:"ChargingBulls.png", ownerName:null },
  { name:"Mighty Tuskers", wallet:14000, squad:[], logo:"MightyTuskers.png", ownerName:null },
  { name:"Royal Tigers", wallet:14000, squad:[], logo:"RoyalTigers.png", ownerName:null },
  { name:"Blazing Phoenix", wallet:14000, squad:[], logo:"BlazingPhoenix.png", ownerName:null },
  { name:"Golden Eagle", wallet:14000, squad:[], logo:"GoldenEagle.png", ownerName:null },
  { name:"Power Panthers", wallet:14000, squad:[], logo:"PowerPanthers.png", ownerName:null }
];

let availablePlayers = [];
let bidLog = [];
let originalPlayers = [];

function showScreen(id,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function uploadCSV(){
  const file=document.getElementById('csvFile').files[0];
  if(!file) return alert("Please select a CSV file first");
  
  console.log('File selected:', file.name, 'Size:', file.size);
  
  Papa.parse(file,{
    header:true,
    skipEmptyLines:true,
    complete:function(res){
      console.log('Raw CSV parsing result:', res);
      console.log('CSV headers found:', res.meta.fields);
      console.log('Number of rows:', res.data.length);
      
      if(res.data.length === 0) {
        alert('CSV file appears to be empty or invalid');
        return;
      }
      
      availablePlayers=res.data.map(function(p, index){
        console.log('Processing row', index + 1, ':', p);
        var basePrice = parseInt(p.BasePrice) || 1000;
        var rank = basePrice >= 600 ? 1 : (basePrice >= 400 ? 2 : 3);
        var isIcon = (p.Icon && (p.Icon.toLowerCase() === 'yes' || p.Icon.toLowerCase() === 'y')) || false;
        var isOwner = (p.Owner && (p.Owner.toLowerCase() === 'yes' || p.Owner.toLowerCase() === 'y')) || false;
        
        var player = {
          name: (p.FirstName || '') + ' ' + (p.LastName || ''),
          basePrice: basePrice,
          photo: p.Photo || "default.png",
          rank: rank,
          isIcon: isIcon,
          isOwner: isOwner,
          teamName: p.Team || null
        };
        
        console.log('Icon value:', p.Icon, 'isIcon result:', isIcon);
        return player;
      });
      
      // Reset team owners and wallets
      teams.forEach(function(t) {
        t.ownerName = null;
        t.wallet = 14000;
      });
      
      // Assign team owners
      availablePlayers.forEach(function(player) {
        if(player.isOwner && player.teamName) {
          console.log('Processing team owner:', player.name, 'Team:', player.teamName);
          var normalizedTeamName = player.teamName.replace(/_/g, ' ').toLowerCase();
          var targetTeam = teams.find(function(t) { 
            var normalizedTName = t.name.replace(/ /g, '_').toLowerCase();
            return t.name.toLowerCase() === normalizedTeamName || 
                   normalizedTName === player.teamName.toLowerCase() ||
                   t.name.toLowerCase().includes(normalizedTeamName) || 
                   normalizedTeamName.includes(t.name.toLowerCase());
          });
          if(targetTeam) {
            targetTeam.ownerName = player.name;
            console.log('Assigned', player.name, 'to', targetTeam.name);
          } else {
            console.log('WARNING: Could not find team for', player.name, 'with team name', player.teamName);
          }
        }
      });
      
      originalPlayers = JSON.parse(JSON.stringify(availablePlayers));
      db.ref('registeredPlayers').set(availablePlayers);
      saveAuction();
      renderAll();
      alert('CSV uploaded successfully! ' + availablePlayers.length + ' players loaded.');
    },
    error:function(err){
      console.error('CSV parsing error:', err);
      alert('CSV parsing error: ' + err.message);
    }
  });
}

function resetCSV(){
  if(confirm("Clear players?")){
    availablePlayers=[];
    originalPlayers=[];
    db.ref('registeredPlayers').remove();
    saveAuction();
    renderAll();
  }
}

function placeBid(ti,pi){
  ti = parseInt(ti);
  pi = parseInt(pi);
  
  const team=teams[ti];
  const player=availablePlayers[pi];
  
  if(!team) {
    alert('Error: Team not found');
    return;
  }
  
  if(!player) {
    alert('Error: Player not found');
    return;
  }
  
  if(!team.squad) team.squad = [];
  
  if(team.squad.length>=14) {
    alert("Squad full");
    return;
  }

  const amt=prompt('Enter bid amount for ' + player.name + '\nBase Price: ' + player.basePrice + '\nTeam: ' + team.name + '\nWallet: ' + team.wallet, player.basePrice);
  
  if(amt === null) return;
  if(!amt || isNaN(amt) || parseInt(amt) <= 0) {
    alert("Invalid bid amount");
    return;
  }
  if(parseInt(amt) > team.wallet) {
    alert("Insufficient wallet balance");
    return;
  }
  if(parseInt(amt) < player.basePrice) {
    alert('Bid must be at least ' + player.basePrice);
    return;
  }

  if(!confirm('Confirm bid:\n' + team.name + ' bids ' + amt + ' for ' + player.name + '?')) return;

  team.wallet -= parseInt(amt);
  team.squad.push({name:player.name, amount:parseInt(amt), photo:player.photo});
  bidLog.push({team:team.name,player:player.name,amount:parseInt(amt),timestamp:new Date().toLocaleTimeString()});
  availablePlayers.splice(pi,1);

  saveAuction();
  renderAll();
}

function resetAuction(){
  if(confirm("Reset auction?")){
    teams.forEach(function(t){t.wallet=14000;t.squad=[];});
    bidLog=[];
    availablePlayers = JSON.parse(JSON.stringify(originalPlayers));
    saveAuction();
    renderAll();
  }
}

function saveAuction(){
  db.ref('auctionState').set({teams:teams,availablePlayers:availablePlayers,bidLog:bidLog});
}

function renderAll(){
  var rank1 = availablePlayers.filter(function(p){return p.rank===1;}).length;
  var rank2 = availablePlayers.filter(function(p){return p.rank===2;}).length;
  var rank3 = availablePlayers.filter(function(p){return p.rank===3;}).length;
  var icons = availablePlayers.filter(function(p){return p.isIcon;}).length;
  var totalRank1 = originalPlayers.filter(function(p){return p.rank===1;}).length;
  var totalRank2 = originalPlayers.filter(function(p){return p.rank===2;}).length;
  var totalRank3 = originalPlayers.filter(function(p){return p.rank===3;}).length;
  var totalIcons = originalPlayers.filter(function(p){return p.isIcon;}).length;

  document.getElementById('rankCounter').innerHTML = 
    '<div><span class="rank-badge rank-1">Rank 1</span><br><b>' + rank1 + '/' + totalRank1 + '</b><br>Available</div>' +
    '<div><span class="rank-badge rank-2">Rank 2</span><br><b>' + rank2 + '/' + totalRank2 + '</b><br>Available</div>' +
    '<div><span class="rank-badge rank-3">Rank 3</span><br><b>' + rank3 + '/' + totalRank3 + '</b><br>Available</div>' +
    '<div><span class="rank-badge icon-badge">ICON</span><br><b>' + icons + '/' + totalIcons + '</b><br>Available</div>';

  document.getElementById('playersTable').innerHTML = originalPlayers.map(function(p){
    var isSold = !availablePlayers.find(function(ap){ return ap.name === p.name; });
    var badges = '<span class="rank-badge rank-' + p.rank + '">Rank ' + p.rank + '</span>';
    if(p.isIcon) {
      badges += '<span class="rank-badge icon-badge">ICON</span>';
    }
    if(p.isOwner) {
      badges += '<span class="rank-badge team-owner-badge">TEAM OWNER</span>';
    }
    if(!p.isIcon && !p.isOwner) {
      badges += '<span class="rank-badge owner-badge">Owner/Player</span>';
    }
    var stamp = isSold ? '<span class="sold-stamp">SOLD</span>' : '';
    return '<tr style="position:relative;"><td><img class="player-photo" src="' + p.photo + '">' + stamp + '</td><td>' + p.name + badges + '</td><td>' + p.basePrice + '</td></tr>';
  }).join('');

  document.getElementById('teamWallets').innerHTML = teams.map(function(t){
    if(!t.squad) t.squad = [];
    var status = t.squad.length >= 14 ? ' - SQUAD COMPLETE!' : '';
    var ownerInfo = t.ownerName ? '<br>Owner: ' + t.ownerName : '';
    return '<div class="team-card"><b>' + t.name + status + '</b>' + ownerInfo + '<br>Wallet: ' + t.wallet + '</div>';
  }).join('');

  document.getElementById('availablePlayers').innerHTML = availablePlayers.map(function(p,i){
    var badges = '<span class="rank-badge rank-' + p.rank + '">Rank ' + p.rank + '</span>';
    if(p.isIcon) {
      badges += '<span class="rank-badge icon-badge">ICON</span>';
    }
    if(p.isOwner) {
      badges += '<span class="rank-badge team-owner-badge">TEAM OWNER</span>';
    }
    if(!p.isIcon && !p.isOwner) {
      badges += '<span class="rank-badge owner-badge">Owner/Player</span>';
    }
    return '<div class="player-card">' +
      '<img class="player-photo" src="' + p.photo + '" style="float:left;margin-right:10px;">' +
      '<b>' + p.name + '</b>' + badges + '<br>' +
      'Base Price: ' + p.basePrice + '<br><br>' +
      '<div>' +
        teams.map(function(t,j){
          if(!t.squad) t.squad = [];
          var isDisabled = t.squad.length >= 14;
          var btnClass = isDisabled ? 'bid-btn' : 'bid-btn';
          var onclick = isDisabled ? '' : 'onclick="placeBid(' + j + ',' + i + ')"';
          return '<button class="' + btnClass + '" ' + onclick + (isDisabled ? ' disabled' : '') + '>' + t.name + '</button>';
        }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('bidLog').innerHTML = bidLog.map(function(b){
    return '<div style="margin:5px 0;padding:5px;background:white;border-radius:5px;">' +
      '<strong>' + b.team + '</strong> bought <strong>' + b.player + '</strong> for <strong>' + b.amount + '</strong>' +
      (b.timestamp ? '<span style="float:right;color:#666;font-size:12px;">' + b.timestamp + '</span>' : '') +
    '</div>';
  }).join('');

  document.getElementById('auctionedList').innerHTML = teams.map(function(t){
    if(!t.squad) t.squad = [];
    return '<div class="auction-team-card">' +
      '<img class="team-logo-watermark" src="' + t.logo + '" alt="' + t.name + '">' +
      '<div class="team-content">' +
        '<div class="team-name-highlight">' + t.name + '</div>' +
        '<div style="text-align:left;">' + 
          (t.squad.length > 0 ? 
            t.squad.map(function(p){ return '<div class="sold-player">✓ ' + p.name + '</div>'; }).join('') : 
            '<div style="color:#999;font-style:italic;text-align:center;">No players yet</div>'
          ) +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

db.ref('registeredPlayers').once('value').then(function(s){
  if(s.exists()) {
    availablePlayers=s.val();
    originalPlayers = JSON.parse(JSON.stringify(availablePlayers));
  }
  renderAll();
});

db.ref('auctionState').on('value',function(s){
  if(!s.exists()) return;
  var d=s.val();
  teams=d.teams||teams;
  availablePlayers=d.availablePlayers||availablePlayers;
  bidLog=d.bidLog||[];
  renderAll();
});
</script>
</body>
</html>
