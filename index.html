<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGL Auction App with Background & Logo</title>
<style>
  /* Background & Logo */
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: url('C:/temp/OGL/background.png') no-repeat center center fixed;
    background-size: cover;
    color: #333;
  }
  header {
    text-align: center;
    position: relative;
    padding: 80px 15px 15px 15px;
  }
  header img {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    height: 60px;
  }
  header h1 {
    color: #ff4500;
    font-size: 2em;
    margin: 0;
  }

  /* Navigation */
  nav { display: flex; justify-content: space-around; background: rgba(230, 57, 70, 0.9); }
  nav button { flex: 1; padding: 12px; border: none; background: none; color: white; font-size: 1em; cursor: pointer; transition: 0.2s; }
  nav button.active, nav button:hover { background: rgba(214, 40, 40, 0.9); }

  /* Screens */
  .screen { display: none; padding: 15px; }
  .screen.active { display: block; background: rgba(255,255,255,0.85); border-radius: 10px; margin: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

  .match-card { display: flex; flex-direction: column; background: rgba(255,255,255,0.85); padding: 12px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .flex { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  button { cursor: pointer; border: none; padding: 8px 12px; border-radius: 6px; }

  .bid-btn { background: #2a9d8f; color: white; }
  .bid-btn:hover { background: #21867a; }
  .end-btn { background: #e76f51; color: white; }
  .end-btn:hover { background: #d65b3f; }
  .reset-btn { background: #f4a261; color: white; }
  .reset-btn:hover { background: #e07b4c; }

  .log { max-height: 200px; overflow-y: auto; background: rgba(241,241,241,0.9); padding: 8px; margin-top: 10px; border-radius: 6px; font-size: 0.9em; }
  .highlight { background: #ffd700; font-weight: bold; padding: 0 4px; border-radius: 3px; }
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4500">


</head>
<body>

<nav>
  <button class="active" onclick="showScreen('retained')">Retained Players</button>
  <button onclick="showScreen('auction')">Auction</button>
  <button onclick="showScreen('report')">Auction Report</button>
</nav>

<!-- Retained Players Screen -->
<div id="retained" class="screen active">
  <h2>Retained Players</h2>
  <div id="retainedList"></div>
</div>

<!-- Auction Screen -->
<div id="auction" class="screen">
  <h2>Auction</h2>
  <div>
    <strong>Current Team Wallets:</strong>
    <div id="teamWallets"></div>
  </div>
  <h3>Available Players:</h3>
  <div id="availablePlayers"></div>
  <h3>Bid History:</h3>
  <div id="bidLog" class="log"></div>
  <div class="flex">
    <button class="reset-btn" onclick="resetAuction()">♻ Reset Auction</button>
  </div>
</div>

<!-- Auction Report Screen -->
<div id="report" class="screen">
  <h2>Auction Report</h2>
  <button onclick="exportReport()" class="end-btn">💾 Export Report</button>
  <div id="reportContent"></div>
</div>

<script>
// --- INITIAL DATA ---
let defaultTeams = [
  { name: "Golden Era Legends", wallet: 14000, squad: ["Muthu Kamal", "Srini", "Sateesh", "Arun T", "Muzeeb", "Pavan", "Manju", "Velu", "Kishore", "Babu", "Bharath"] },
  { name: "The Wall Warriors", wallet: 14000, squad: ["Srikanth", "Karthik", "Sunil", "Venu", "Lawrence"] },
  { name: "Sunny Stroke Legends", wallet: 14000, squad: ["Ananda", "Danny", "Rakesh", "Theertha", "Imran", "Prashanth"] },
  { name: "Master Blasters", wallet: 14000, squad: ["Rohan", "Nilesh", "Bharat", "Rakesh", "Prashant H", "Sachin S"] },
  { name: "Hitman Heritage", wallet: 14000, squad: ["Abhishek"] },
  { name: "Run Machine Royals", wallet: 14000, squad: ["Saro", "Arun"] },
  { name: "Sehwag Sixers", wallet: 14000, squad: ["Shantkumar", "Rudresh", "Shashi"] },
  { name: "Kapil Devils", wallet: 14000, squad: ["Naresh"] }
];

let defaultPlayers = [
  { name: "Deepu", basePrice: 2000 },
  { name: "Sandeep", basePrice: 1000 }
];

// --- LOAD OR INIT ---
let teams = JSON.parse(localStorage.getItem('teams')) || defaultTeams;
let availablePlayers = JSON.parse(localStorage.getItem('availablePlayers')) || defaultPlayers;
let bidLog = JSON.parse(localStorage.getItem('bidLog')) || [];

// --- SAVE ---
function saveData(){
  localStorage.setItem('teams', JSON.stringify(teams));
  localStorage.setItem('availablePlayers', JSON.stringify(availablePlayers));
  localStorage.setItem('bidLog', JSON.stringify(bidLog));
}

// --- SCREEN SWITCH ---
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.querySelector(`nav button[onclick="showScreen('${id}')"]`).classList.add('active');
  if(id==='auction') updateAuctionScreen();
  if(id==='report') updateReport();
}

// --- RENDER RETAINED ---
function renderRetained(){
  let html = '';
  teams.forEach(team=>{
    html += `<h3>${team.name}</h3><ul>`;
    team.squad.forEach(p=>{
      let parts = p.split('(');
      if(parts.length>1){
        html += `<li><span class="highlight">${parts[0].trim()}</span> (${parts[1]}`;
      } else {
        html += `<li>${p}</li>`;
      }
      html += `</li>`;
    });
    html += `</ul>`;
  });
  document.getElementById('retainedList').innerHTML = html;
}

// --- AUCTION ---
function updateAuctionScreen(){
  let walletsHtml = '';
  teams.forEach(t=> walletsHtml += `<div>${t.name}: ${t.wallet} points</div>`);
  document.getElementById('teamWallets').innerHTML = walletsHtml;

  let playersHtml = '';
  availablePlayers.forEach((p,i)=>{
    playersHtml += `<div class="match-card">
      <strong>${p.name}</strong> (Base Price: ${p.basePrice}) 
      <div class="flex">
        ${teams.map((t,j)=>`<button class="bid-btn" onclick="placeBid(${j},${i})">${t.name} Bid</button>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('availablePlayers').innerHTML = playersHtml;

  document.getElementById('bidLog').innerHTML = bidLog.map(b=>`${b.team} bid ${b.amount} on ${b.player}`).join('<br>');
}

// --- PLACE BID ---
function placeBid(teamIndex, playerIndex){
  let team = teams[teamIndex];
  let player = availablePlayers[playerIndex];

  let bidAmount = prompt(`${team.name} bid for ${player.name} (Base: ${player.basePrice})`, player.basePrice);
  if(!bidAmount) return;
  bidAmount = parseInt(bidAmount);
  if(bidAmount > team.wallet){ alert("Not enough points!"); return; }

  if(confirm(`Admin: Confirm highest bid of ${bidAmount} points by ${team.name} for ${player.name}?`)){
    team.wallet -= bidAmount;
    team.squad.push(`${player.name} (${bidAmount})`);
    bidLog.push({team: team.name, player: player.name, amount: bidAmount});
    availablePlayers.splice(playerIndex,1);
    saveData();
    updateAuctionScreen();
    renderRetained();
  }
}

// --- RESET AUCTION ---
function resetAuction(){
  if(confirm("This will reset all bids and restore initial data. Are you sure?")){
    localStorage.removeItem('teams');
    localStorage.removeItem('availablePlayers');
    localStorage.removeItem('bidLog');
    teams = JSON.parse(JSON.stringify(defaultTeams));
    availablePlayers = JSON.parse(JSON.stringify(defaultPlayers));
    bidLog = [];
    saveData();
    renderRetained();
    updateAuctionScreen();
  }
}

// --- REPORT ---
function updateReport(){
  let html = '';
  teams.forEach(team=>{
    html += `<h3>${team.name}</h3><ul>`;
    team.squad.forEach(p=>{
      let parts = p.split('(');
      if(parts.length>1){
        html += `<li><span class="highlight">${parts[0].trim()}</span> (${parts[1]}`;
      } else { html += `<li>${p}</li>`; }
      html += `</li>`;
    });
    html += `</ul>Remaining Wallet: ${team.wallet}`;
  });
  html += `<h4>Bid History</h4>`;
  bidLog.forEach(b=> html += `<div>${b.team} -> ${b.player} : ${b.amount}</div>`);
  document.getElementById('reportContent').innerHTML = html;
}

// --- EXPORT REPORT ---
function exportReport(){
  let data = {teams,bidLog};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ogl_auction_report.json';
  a.click();
}

// --- INIT ---
renderRetained();
updateAuctionScreen();
</script>

</body>
</html>
